name: Check Render deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  smoke-test:
    name: Check the live service
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RENDER_SERVICE_URL: ${{ vars.RENDER_SERVICE_URL }}
    steps:
      - name: Wait for the homepage and health endpoint
        run: bash .github/scripts/check-render-deployment.sh

  alert-maintainers:
    name: Alert maintainers about the outage
    runs-on: ubuntu-latest
    needs: smoke-test
    if: failure()
    steps:
      - name: Open or update the Render availability issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = "[Render availability] deployment check failed";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const message = [
              "The Render deployment availability check failed. Review the smoke-test logs for the failing endpoint or configuration.",
              "",
              `Workflow run: ${runUrl}`,
              `Commit: ${context.sha}`,
            ].join("\n");

            const { owner, repo } = context.repo;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              per_page: 100,
            });
            const existingIssue = issues.find(
              (issue) => !issue.pull_request && issue.title === title
            );

            if (existingIssue) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existingIssue.number,
                body: message,
              });
              core.info(`Updated existing Render availability issue #${existingIssue.number}.`);
            } else {
              const { data: issue } = await github.rest.issues.create({
                owner,
                repo,
                title,
                body: message,
              });
              core.info(`Created Render availability issue #${issue.number}.`);
            }

  resolve-outage:
    name: Close the Render availability issue after recovery
    runs-on: ubuntu-latest
    needs: smoke-test
    if: needs.smoke-test.result == 'success'
    steps:
      - name: Comment on and close the Render availability issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = "[Render availability] deployment check failed";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "open",
              per_page: 100,
            });
            const outage = issues.find(
              (issue) => !issue.pull_request && issue.title === title
            );

            if (!outage) {
              core.info("No open Render availability issue to close.");
              return;
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: outage.number,
              body: `Render is responding successfully again. Closing this outage issue after a successful availability check.\n\nWorkflow run: ${runUrl}`,
            });
            await github.rest.issues.update({
              owner,
              repo,
              issue_number: outage.number,
              state: "closed",
              state_reason: "completed",
            });
            core.info(`Closed recovered Render availability issue #${outage.number}.`);
