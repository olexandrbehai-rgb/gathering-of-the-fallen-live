name: Check Render deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Run the smoke check and its incident update as one serialized operation.
# Keep active checks running so newer push/manual runs cannot interrupt alerting.
concurrency:
  group: render-deployment-availability-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  smoke-test:
    name: Check the live service
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      failed_endpoint_details: ${{ steps.smoke_check.outputs.failed_endpoint_details }}
    env:
      RENDER_SERVICE_URL: ${{ vars.RENDER_SERVICE_URL }}
    steps:
      - name: Wait for the homepage and health endpoint
        id: smoke_check
        run: bash .github/scripts/check-render-deployment.sh

  alert-maintainers:
    name: Alert maintainers about the outage
    runs-on: ubuntu-latest
    needs: smoke-test
    if: always() && (needs.smoke-test.result == 'success' || needs.smoke-test.result == 'failure')
    permissions:
      issues: write
    steps:
      - name: Open or update the Render availability issue
        if: needs.smoke-test.result == 'failure'
        uses: actions/github-script@v7
        env:
          FAILED_ENDPOINT_DETAILS: ${{ needs.smoke-test.outputs.failed_endpoint_details }}
        with:
          script: |
            const title = "[Render availability] deployment check failed";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const failedEndpointDetails = (process.env.FAILED_ENDPOINT_DETAILS || "")
              .split(",")
              .map((detail) => {
                const match = detail.trim().match(
                  /^(homepage|health endpoint): (HTTP [45]\d{2}|transport failure)$/
                );
                return match ? `${match[1]} (${match[2]})` : null;
              })
              .filter(Boolean);
            const message = [
              `The Render deployment availability check failed. Endpoints still failing after retries: ${failedEndpointDetails.length ? failedEndpointDetails.join(", ") : "not available (the smoke check failed before retry exhaustion)."}`,
              "",
              `Workflow run: ${runUrl}`,
              `Commit: ${context.sha}`,
            ].join("\n");

            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "open",
              per_page: 100,
            });
            const existingIssue = issues.find(
              (issue) => !issue.pull_request && issue.title === title
            );

            if (existingIssue) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existingIssue.number,
                body: message,
              });
              core.info(`Updated existing Render availability issue #${existingIssue.number}.`);
            } else {
              const { data: issue } = await github.rest.issues.create({
                owner,
                repo,
                title,
                body: message,
              });
              core.info(`Created Render availability issue #${issue.number}.`);
            }

      - name: Comment on and close the Render availability issue
        if: needs.smoke-test.result == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "[Render availability] deployment check failed";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "open",
              per_page: 100,
            });
            const outage = issues.find(
              (issue) => !issue.pull_request && issue.title === title
            );

            if (!outage) {
              core.info("No open Render availability issue to close.");
              return;
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: outage.number,
              body: `Render is responding successfully again. Closing this outage issue after a successful availability check.\n\nWorkflow run: ${runUrl}`,
            });
            await github.rest.issues.update({
              owner,
              repo,
              issue_number: outage.number,
              state: "closed",
              state_reason: "completed",
            });
            core.info(`Closed recovered Render availability issue #${outage.number}.`);
