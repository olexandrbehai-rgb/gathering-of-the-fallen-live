name: Create GitHub Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# Serialize the release check through publication so each run checks the releases
# created by the previous active run. GitHub keeps one pending run per group;
# a newer run replaces that pending run (but does not cancel the active run).
# If a tag's run is replaced, rerun it after the queued release finishes.
concurrency:
  group: stable-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Release tags must use vMAJOR.MINOR.PATCH, for example v1.2.3."
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Test release version comparison
        run: node --test .github/scripts/check-release-version.test.mjs

      - name: Check release version is newer
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/check-release-version.sh "$GITHUB_REF_NAME"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
