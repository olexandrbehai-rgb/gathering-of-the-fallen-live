name: Check generated database migrations

on:
  pull_request:
    paths:
      - lib/db/src/schema/**
      - lib/db/migrations/**
      - lib/db/drizzle.migrations.config.ts
      - lib/db/package.json
      - lib/db/scripts/check-generated-migrations.mjs
      - lib/db/test/check-generated-migrations.test.mjs
      - lib/db/MIGRATIONS.md
      - .github/workflows/check-generated-migrations.yml
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  push:
    branches:
      - main
    paths:
      - lib/db/src/schema/**
      - lib/db/migrations/**
      - lib/db/drizzle.migrations.config.ts
      - lib/db/package.json
      - lib/db/scripts/check-generated-migrations.mjs
      - lib/db/test/check-generated-migrations.test.mjs
      - lib/db/MIGRATIONS.md
      - .github/workflows/check-generated-migrations.yml
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Reject unreviewed Drizzle migrations
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test migration drift check
        run: pnpm --filter @workspace/db run test:generated-migrations

      - name: Check for generated migrations
        run: pnpm --filter @workspace/db run check:generated-migrations
